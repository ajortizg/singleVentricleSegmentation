[DATA]
; BASE_PATH_3D = data/singleVentricleData
BASE_PATH_3D = data/singleVentricleData_cut_x10
; BASE_PATH_3D = data/singleVentricleData_prolongationCubic
VOLUMES_SUBDIR_PATH = NIFTI_4D_Datasets
SEGMENTATIONS_SUBDIR_PATH = NIFTI_Single_Ventricle_Segmentations
SEGMENTATIONS_FILE_NAME = Segmentation_volumes.xlsx
; PATIENT_NAME = Adolescent_17
; PATIENT_NAME = SyntheticPatient_1

# Results from optical flow computation
FWD_OPTFLOW_RESULTS_DIR = results/singleVentricleData_cut_OF/TVL1OF3DForward_20220530-163529
BWD_OPTFLOW_RESULTS_DIR = results/singleVentricleData_cut_OF/TVL1OF3DBackward_20220530-163848

OUTPUT_PATH = results
TRAINED_MODEL = results/CNN_20220602-200618/model.pth


[DEVICE]
CUDA_AVAILABLE = 1
CUDA_DEVICE = 2


[PARAMETERS]
USE_MEDIAN_FILTERED_FLOW = 1
FLIP_MASKS = 0

NUM_CLASSES = 1
INPUT_CHANNELS = 2
NUM_LAYERS = 2
FEATURES_START = 8
DROPOUT = 0
DROPOUT_PROB = 0.5
KERNEL_SIZE = 3,3,3
PADDING = 1
TRILINEAR = 0
NUM_EPOCHS = 500
BATCH_SIZE = 1
SHUFFLE = 1

# Optim Adam
LR = 0.001
WEIGHT_DECAY = 0
BETA1 = 0.9
BETA2 = 0.999

# Schedule
STEP_SIZE = 100
GAMMA = 0.8



[WARPING]
#LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

; InterpolationType = NEAREST
InterpolationType = LINEAR
; InterpolationType = CUBIC_HERMITESPLINE

; BoundaryType = NEAREST
BoundaryType = MIRROR
; BoundaryType = REFLECT


[DEBUG]
VERBOSE = 1