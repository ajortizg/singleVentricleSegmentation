[DATA]
dataset = Dataset012_SVDraw
; For fold in [0, 1, 2, 3, 4]
fold = 0
root_dir = data/nnUNet_raw/%(dataset)s
output_dir = results/segmentation/%(dataset)s


[PARAMETERS]
NUM_EPOCHS = 500
; Early stop
PATIENCE = 500
; unet3d, basic_unet3d, res_unet3d, unet, unetr, swin_unetr
NET = unet3d
NUM_CLASSES = 2
; 3,4,5
NUM_LAYERS = 4
; 8,16,32
FEATURES_START = 16
; for unetr only
HIDDEN_SIZE = 768
MLP_DIM = 3072
NUM_HEADS = 12
; for res_unet3d
NUM_RES_UNITS = 3
;relu, prelu, leaky_relu
ACTIVATION = leaky_relu
ACTIVATION_SLOPE = 0.1
; Options: 1,4,8
BATCH_SIZE = 8
; CPU for data loading
NUM_WORKERS = 12
; Optim Adam
LR = 1e-3
WEIGHT_DECAY = 3e-5
BETA1 = 0.9
BETA2 = 0.999
; LR Schedule
STEP_SIZE = 1
GAMMA = 0.998
img_size = 96
; qn, zscore, minmax
norm = qn
; ce, dice, dice_ce
loss_fn = dice_ce
lambda_dice = 1.0
lambda_ce = 1.0

; do not touch those
INPUT_CHANNELS = 1
KERNEL_SIZE = 3,3,3
PADDING = 1
TRILINEAR = 0
RESIDUAL = 0
; sigmoid, none
OUT_LAYER = none


[DATA_AUGMENTATION]
; ======== Geometric transformations ========

; Flip
horizontal_flip_prob = 0.5
vertical_flip_prob = 0.5
depth_flip_prob = 0.5

; Rotation
rot_prob = 1.0
rot_x_range = (-30,30)
rot_y_range = (-30,30)
rot_z_range = (-30,30)
; zeros, border, reflection
rot_boundary = zeros

; Scale
scaling_prob = 0.2
scaling_range = (0.7,1.4)
scaling_boundary = zeros

# Elastic deformation
ed_prob = 0.1
ed_grid = 8
ed_sigma_range = (0.5,1.5)
; mirror, reflect, constant, nearest
ed_boundary = constant
; zyx, yx
ed_axis = zyx

# Low resolution
lowres_prob = 0.25
lowres_zoom_range = (0.5,1.0)

; ======== Intesity transformations ========

; Multiplicative scaling
mult_scaling_prob = 0.15
mult_scaling_range = (0.75,1.25)

; Gamma scaling
gamma_scaling_prob = 0.3
gamma_scaling_range = (0.7,1.5)
gamma_retain_stats = 1

; Gaussian noise
noise_prob = 0.1
noise_mu = 0.0
noise_std_range = (0.0,0.1)

; Gaussian blur
blur_prob = 0.2
blur_sigma_range = (0.5,1.0)

; Contrast augmentation
contrast_prob = 0.15
contrast_range = (0.75,1.25)
contrast_preserve_range = 1

; ; Additive scaling
; ADD_SCALING_PROB = 0.0
; ADD_SCALING_MEAN = 0.0
; ADD_SCALING_STD = 0.05