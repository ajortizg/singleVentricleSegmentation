[DATA]
#3d
; BASE_PATH_3D = data/singleVentricleData
BASE_PATH_3D = data/singleVentricleData_cut
; BASE_PATH_3D = data/singleVentricleData_prolongationNearest
; BASE_PATH_3D = data/singleVentricleData_prolongationLinear
; BASE_PATH_3D = data/singleVentricleData_prolongationCubic
; BASE_PATH_3D = data/Synthetic3D
VOLUMES_SUBDIR_PATH = NIFTI_4D_Datasets
SEGMENTATIONS_SUBDIR_PATH = NIFTI_Single_Ventricle_Segmentations
SEGMENTATIONS_FILE_NAME = Segmentation_volumes.xlsx
; PATIENT_NAME = Adult_30
; PATIENT_NAME = SyntheticPatient_1

OUTPUT_PATH = results

[DEVICE]
cuda_availabe = 1
cuda_device = 1


[PARAMETERS]
# Compute the optical flow every n timesteps
step = 4

#LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

# Forward -> propagation from m0 to mk
# Backward -> propagation from mk to m0
; mode = Forward
mode = Backward

useAnisotropicDifferentialOp = 1
anisotropicDifferentialOp_alpha = 5.
anisotropicDifferentialOp_beta = 0.5

useGaussianBlur = 1
GaussianBlurSigma = 2.

NUM_SCALES = 3
MAX_WARPS = 15
MAX_OUTER_ITERATIONS = 300


weight_Matching = 1.
weight_TV = 0.025

PRIMALDUAL_ALGO_TYPE = 2
sigma = 0.5
tau = 0.5
theta = 0.25
gamma = 1.

; InterpolationType = NEAREST
; InterpolationType = LINEAR
InterpolationType = CUBIC_HERMITESPLINE

; BoundaryType = NEAREST
BoundaryType = MIRROR
; BoundaryType = REFLECT

[DEBUG]
useDebugOutput = 0




