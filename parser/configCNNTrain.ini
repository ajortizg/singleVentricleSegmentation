[DATA]
; BASE_PATH_3D = data/singleVentricleData
BASE_PATH_3D = data/singleVentricleData_split

VOLUMES_SUBDIR_PATH = NIFTI_4D_Datasets
SEGMENTATIONS_SUBDIR_PATH = NIFTI_Single_Ventricle_Segmentations
SEGMENTATIONS_FILE_NAME = Segmentation_volumes.xlsx

OUTPUT_PATH = results
                

[DEVICE]
CUDA_AVAILABLE = 1


[PARAMETERS]
USE_MEDIAN_FILTERED_FLOW = 1
NUM_CLASSES = 1
INPUT_CHANNELS = 2
KERNEL_SIZE = 3,3,3
PADDING = 1
TRILINEAR = 0
SHUFFLE = 1
NUM_EPOCHS = 500

; ACTIVATION = relu
; ACTIVATION = prelu
ACTIVATION = leaky_relu
ACTIVATION_SLOPE = 0.2

LOSS_FN = mse
; LOSS_FN = bce
; LOSS_FN = bce_dice
; LOSS_ALPHA = 0.6
; LOSS_FN = huber
; HUBER_DELTA = 1.35
LOSS_REDUCTION = mean
LOSS_LAMBDA = 1

# Normalization layer
# BN = BatchNorm3d
# IN = InstanceNorm3d
NORM_LAYER = IN

# Use residual learning
RESIDUAL = 1

# Options: 1,4,8
BATCH_SIZE = 1

# Total of GPUs used for training 
NUM_GPUS = 1

# CPU for data loading
NUM_WORKERS = 12

# possible tuning of parameters:
# options: 3,4,5
NUM_LAYERS = 4

# options: 8,16,32
FEATURES_START = 8

; NUM_RES_UNITS = 2

# Optim Adam
LR = 1e-3
WEIGHT_DECAY = 1e-3
BETA1 = 0.9
BETA2 = 0.999

# Schedule
STEP_SIZE = 50
GAMMA = 0.8


[WARPING]
#LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

; InterpolationType = NEAREST
InterpolationType = LINEAR
; InterpolationType = CUBIC_HERMITESPLINE

; BoundaryType = NEAREST
BoundaryType = MIRROR
; BoundaryType = REFLECT


[DEBUG]
VERBOSE = 1