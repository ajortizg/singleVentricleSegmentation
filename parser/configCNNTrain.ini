[DATA]
; BASE_PATH_3D = data/singleVentricleData
BASE_PATH_3D = data/singleVentricleData_prolongLinear_split

VOLUMES_SUBDIR_PATH = NIFTI_4D_Datasets
SEGMENTATIONS_SUBDIR_PATH = NIFTI_Single_Ventricle_Segmentations
SEGMENTATIONS_FILE_NAME = Segmentation_volumes.xlsx

OUTPUT_PATH = results
                        

[DEVICE]
CUDA_AVAILABLE = 1
CUDA_DEVICE = 0


[PARAMETERS]
USE_MEDIAN_FILTERED_FLOW = 1

NUM_CLASSES = 1
INPUT_CHANNELS = 2
DROPOUT = 0
DROPOUT_PROB = 0.5
KERNEL_SIZE = 3,3,3
PADDING = 1
TRILINEAR = 0
NUM_EPOCHS = 500
SHUFFLE = 1

# Options: 1,4,8
BATCH_SIZE = 2

# possible tuning of parameters:
# options: 3 or 4?
NUM_LAYERS = 3
# options: 8,16
FEATURES_START = 16

# Optim Adam
LR = 0.001
WEIGHT_DECAY = 0
BETA1 = 0.9
BETA2 = 0.999

# Schedule
STEP_SIZE = 50
GAMMA = 1.0


[WARPING]
#LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

; InterpolationType = NEAREST
InterpolationType = LINEAR
; InterpolationType = CUBIC_HERMITESPLINE

; BoundaryType = NEAREST
BoundaryType = MIRROR
; BoundaryType = REFLECT


[DEBUG]
VERBOSE = 1