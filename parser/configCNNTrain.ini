[DATA]
BASE_PATH_3D = data/singleVentricleData_split
VOLUMES_SUBDIR_PATH = NIFTI_4D_Datasets
SEGMENTATIONS_SUBDIR_PATH = NIFTI_Single_Ventricle_Segmentations
SEGMENTATIONS_FILE_NAME = Segmentation_volumes.xlsx

OUTPUT_PATH = results
                

[PARAMETERS]
PRETRAINED = 0
CHECKPOINT_FILE = results/CNN_20220809-103422/weights.pth

; unet3d, basic_unet3d, res_unet3d
NET = unet3d
USE_MEDIAN_FILTERED_FLOW = 1
NUM_CLASSES = 1
INPUT_CHANNELS = 2
KERNEL_SIZE = 3,3,3
PADDING = 1
TRILINEAR = 0
NUM_EPOCHS = 500

RESIDUAL = 1

; Spectral normalization. Reducing the Lipschitz constant of the model
LIPSCHITZ_REGULARIZATION = 1
MAX_LIPSCHITZ_CONSTANT = 100.0
POWER_ITS = 1
POWER_EPS = 1e-8

;relu, prelu
ACTIVATION = leaky_relu
ACTIVATION_SLOPE = 0.1

; mse, huber
LOSS_FN = mse
; HUBER_DELTA = 1.35
; sum, mean
LOSS_REDUCTION = sum
LOSS_LAMBDA = 1
LOSS_PENALIZATION = 0
LOSS_PENALIZATION_MU = 10

; Options: 1,4,8
BATCH_SIZE = 1

; Total of GPUs used for training 
NUM_GPUS = 1

; CPU for data loading
NUM_WORKERS = 8

; 3,4,5
NUM_LAYERS = 4

; 8,16,32
FEATURES_START = 16

NUM_RES_UNITS = 1

; Optim Adam
LR = 1e-3
WEIGHT_DECAY = 1e-5
BETA1 = 0.9
BETA2 = 0.999

; LR Schedule
STEP_SIZE = 50
GAMMA = 0.8


[DATA_AUGMENTATION]
; ======== Geometric transformations ========

; Flip
HORIZONTAL_FLIP_PROB = 0.4
VERTICAL_FLIP_PROB = 0.4
DEPTH_FLIP_PROB = 0.1

; Rotation
ROT_PROB = 0.3
ROT_X_RANGE = -10,10
ROT_Y_RANGE = -10,10
ROT_Z_RANGE = 0,360
; zeros, border, reflection
ROT_BOUNDARY = border

# Elastic deformation
ED_PROB = 0.05
ED_GRID = 10
ED_SIGMA_RANGE = 0.5,2.0
; mirror, reflect, constat, nearest
ED_BOUNDARY = nearest
ED_USE_PREFILTER = 0
; zyx, yx
ED_AXIS = yx

; ======== Intesity transformations ========

; Multiplicative scaling
MULT_SCALING_PROB = 0.3
MULT_SCALING_RANGE = 0.9,1.1

; Additive scaling
ADD_SCALING_PROB = 0.1
ADD_SCALING_MEAN = 0.0
ADD_SCALING_STD = 0.05

; Gamma scaling
GAMMA_SCALING_PROB = 0.1
GAMMA_SCALING_RANGE = 0.9,1.1

; Gaussian noise
NOISE_PROB = 0.1
NOISE_MU = 0.0
NOISE_STD = 0.015

CLIP_INTERVAL = 0.0,1.0


[WARPING]
; LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

; NEAREST, LINEAR, CUBIC_HERMITESPLINE
InterpolationType = LINEAR

; BoundaryType = NEAREST, REFLECT, MIRROR
BoundaryType = MIRROR


[DEBUG]
VERBOSE = 1