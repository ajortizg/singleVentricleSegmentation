[DATA]
PRETRAINED_DIR = results/CNN_20220817-175537
WEIGHTS_FILENAME = best_val_checkpoint.pth
PATIENT_NAME = patient055
; test, train, val
DATASET = val

OUTPUT_PATH = results


[PARAMETERS]
NUM_EPOCHS = 500
NUM_GPUS = 1
NUM_WORKERS = 4

# Optim Adam
LR = 1e-3
WEIGHT_DECAY = 1e-3
BETA1 = 0.9
BETA2 = 0.999

# Schedule
STEP_SIZE = 50
GAMMA = 0.8

LOSS_FN = mse
; LOSS_FN = huber
; HUBER_DELTA = 1.35
LOSS_REDUCTION = sum
LOSS_LAMBDA = 1
LOSS_PENALIZATION = 0
LOSS_PENALIZATION_MU = 1e-4


[WARPING]
#LenghtType: numDofs or fixed
LenghtType = numDofs
; LenghtType = fixed
; LenghtZ = 1
; LenghtY = 1
; LenghtX = 1

; InterpolationType = NEAREST
InterpolationType = LINEAR
; InterpolationType = CUBIC_HERMITESPLINE

; BoundaryType = NEAREST
BoundaryType = MIRROR
; BoundaryType = REFLECT


[DATA_AUGMENTATION]