[DATA]
PRETRAINED_DIR = results/CNN_20220726-151133
WEIGHTS_FILENAME = best_train_weights.pth
PATIENT_NAME = Child_73

OUTPUT_PATH = results


[PARAMETERS]
NUM_EPOCHS = 500
