data:
  # Input data will be loaded from this dir
  base_dir: 'results/acdc_right-ventricle_20240519-114808'
  imgs_dir: 'NIFTI_4D_Datasets'
  segs_dir: 'NIFTI_Single_Ventricle_Segmentations'
  metadata_file: 'Segmentation_volumes.xlsx'

  # Output data will be save in this dir
  out_dir: 'results'

# Create visualization by overlaping images with segmentation masks.
debug:
  viz: false
  alpha: 0.3
  color:
    - 0
    - 1
    - 1
  aspect_ratio: 1.7
  gif: true
  dur: 200

# Step 2
orientation:
  axcodes: 'RAS'

# Step 3
isotropic_resample:
  pixdim:
  - 1.0
  - 1.0
  - 1.0
  mode: 'bilinear'        # nearest, bilinear or bicubic
  padding_mode: 'border'  # zeros, border or reflection
  align_corners: false

# Step 2
cutting:
  x_tol: 10
  y_tol: 10
  z_tol: 10

# Step 3
prolongation:
  nx: 80
  ny: 80
  nz: 80
  pad_time: 40

  # Interpolation stuff
  length_type: 'numDofs'    # numDofs or fixed. If fixed, then set lx, ly, and lz
  lx: 1
  ly: 1
  lz: 1
  interpolation: 'LINEAR'   # NEAREST, LINEAR or CUBIC_HERMITESPLINE
  boundary: 'MIRROR'        # NEAREST, MIRROR or REFLECT

# Step 4
# normalization:

# Step 5
split:
  val_size: 20
  seed: 42

  test:
    - 'Adolescent_53'
    - 'Adult_11'
    - 'Child_73'