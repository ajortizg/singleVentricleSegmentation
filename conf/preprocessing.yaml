data:
  # Input data will be loaded from this dir
  base_dir: 'data/acdc_right-ventricle_preprocessing_norm'
  imgs_dir: 'NIFTI_4D_Datasets'
  segs_dir: 'NIFTI_Single_Ventricle_Segmentations'
  metadata_file: 'Segmentation_volumes.xlsx'

  # Output data will be save in this dir
  out_dir: 'results'

# Create visualization by overlaping images with segmentation masks.
debug:
  viz: true
  gif: true
  dur: 200

# Step 1
# SV dataset has some inconsistencies. No need to do this step for ACDC dataset
flipping:
  patients: 
    - Adolescent_7
    - Adolescent_26
    - Adolescent_54
    - Adolescent_75
    - Adult_6
    - Adult_11
    - Adult_16
    - Adult_17
    - Child_27

# Step 2
cutting:
  x_tol: 10
  y_tol: 10
  z_tol: 10

# Step 3
prolongation:
  nx: 80
  ny: 80
  nz: 80
  pad_time: 40

  # Interpolation stuff
  length_type: 'numDofs'    # numDofs or fixed. If fixed, then set lx, ly, and lz
  lx: 1
  ly: 1
  lz: 1
  interpolation: 'LINEAR'   # NEAREST, LINEAR or CUBIC_HERMITESPLINE
  boundary: 'MIRROR'        # NEAREST, MIRROR or REFLECT

# Step 4
# normalization:

# Step 5
split:
  val_size: 20
  seed: 42

  test:
    - 'Adolescent_53'
    - 'Adult_11'
    - 'Child_73'