transforms:
  train:
    - _target_: svs.modules.transforms.dtransforms.RandomHorizontalFlip
      p: 0.5
    - _target_: svs.modules.transforms.dtransforms.RandomVerticalFlip
      p: 0.5
    - _target_: svs.modules.transforms.dtransforms.RandomRotation
      degrees: 45
    - _target_: svs.modules.transforms.dtransforms.ColorJitter
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
    - _target_: svs.modules.transforms.dtransforms.ToTensor

  val:
    - _target_: svs.modules.transforms.dtransforms.ToTensor